name: Build and validate FrozenApps

on:
  push:
    branches: ["**"]
    tags: ["v*", "[0-9]*"]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "LICENSES/**"
      - "latest_version.txt"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozenapps-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: xcode-27
    steps:
      - name: Checkout FrozenApps source
        uses: actions/checkout@v4

      - name: Prepare pinned installer engine (sparse checkout)
        shell: bash
        run: bash scripts/prepare-engine-source.sh

      - name: Cache Rust dependencies and release builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Vendor/SideInstaller/rust-core/target
          key: ${{ runner.os }}-${{ runner.arch }}-sideinstaller-rust-${{ hashFiles('Vendor/SideInstaller/rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sideinstaller-rust-

      - name: Select Xcode and install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          swift --version
          python3 --version
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Apply FrozenApps branding and privacy terms
        run: python3 scripts/apply-frozenapps-branding.py

      - name: Build Rust pairing and signing engine plus iOS app
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR="$(xcode-select -p)"
          export IPHONEOS_DEPLOYMENT_TARGET=17.4
          bash Vendor/SideInstaller/build-rust.sh
          xcodegen generate
          set -o pipefail
          xcodebuild -project FrozenApps.xcodeproj -scheme FrozenApps \
            -configuration Release -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee "$GITHUB_WORKSPACE/build.log"

      - name: Validate native engine and app bundle
        shell: bash
        run: bash scripts/validate-build.sh

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release-iphoneos/FrozenApps.app"
          IPA_ROOT="$GITHUB_WORKSPACE/ipa-root"
          IPA="$GITHUB_WORKSPACE/FrozenApps-unsigned.ipa"
          test -d "$APP"
          rm -rf "$IPA_ROOT" "$IPA"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP" "$IPA_ROOT/Payload/FrozenApps.app"
          (cd "$IPA_ROOT" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"
          python3 - "$IPA" "$(awk -F: '/^[[:space:]]*MARKETING_VERSION:/ { gsub(/[" ]/, "", $2); print $2; exit }' project.yml)" "$(awk -F: '/^[[:space:]]*CURRENT_PROJECT_VERSION:/ { gsub(/[" ]/, "", $2); print $2; exit }' project.yml)" <<'PY'
          import os, plistlib, sys, zipfile

          ipa, expected_version, expected_build = sys.argv[1:]
          if os.path.getsize(ipa) < 1_000_000:
              raise SystemExit("IPA is unexpectedly small; refusing to publish a likely incomplete package.")
          required = {
              "Payload/FrozenApps.app/Info.plist",
              "Payload/FrozenApps.app/FrozenApps",
              "Payload/FrozenApps.app/PlugIns/FrozenAppsLiveActivity.appex/Info.plist",
          }
          with zipfile.ZipFile(ipa) as package:
              damaged = package.testzip()
              if damaged:
                  raise SystemExit(f"IPA ZIP integrity check failed at: {damaged}")
              names = set(package.namelist())
              missing = required - names
              if missing:
                  raise SystemExit("IPA is missing required app bundle entries: " + ", ".join(sorted(missing)))
              plist = plistlib.loads(package.read("Payload/FrozenApps.app/Info.plist"))
              actual = {
                  "CFBundleIdentifier": "com.itzmnyzzz.frozenapps",
                  "CFBundleShortVersionString": expected_version,
                  "CFBundleVersion": expected_build,
                  "MinimumOSVersion": "17.4",
              }
              for key, expected in actual.items():
                  if str(plist.get(key, "")) != expected:
                      raise SystemExit(f"IPA metadata mismatch for {key}: expected {expected!r}, got {plist.get(key)!r}")
              print("PASS: IPA ZIP CRC and required app bundle entries")
              print(f"PASS: bundle {plist['CFBundleIdentifier']} version {expected_version} build {expected_build}")
              print(f"PASS: minimum iOS {plist['MinimumOSVersion']}")
              print("SIGNING: this workflow deliberately creates an unsigned IPA; it is not ready to install until signed using a supported method.")
          PY
          shasum -a 256 "$IPA" | tee "$GITHUB_WORKSPACE/FrozenApps-unsigned.ipa.sha256"
          ls -lh "$IPA"

      # A normal version-tag push publishes to that tag. The one-off
      # [publish-release] commit path lets us repair an already-created release
      # whose tag did not trigger this workflow (e.g. numeric tag 1.0.5).
      - name: Resolve release tag
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]')))
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            RELEASE_TAG="$(tr -d '[:space:]' < release-target.txt)"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          PROJECT_VERSION="$(awk -F: '/^[[:space:]]*MARKETING_VERSION:/ { gsub(/[" ]/, "", $2); print $2; exit }' project.yml)"
          NORMALIZED_TAG="$RELEASE_TAG"
          NORMALIZED_TAG="${NORMALIZED_TAG#v}"
          if [[ "$NORMALIZED_TAG" != "$PROJECT_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match app version $PROJECT_VERSION; refusing to publish a mismatched IPA." >&2
            exit 1
          fi
          echo "FROZEN_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Point release tag at the validated source commit
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]')
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(tr -d '[:space:]' < release-target.txt)"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

      - name: Attach validated IPA to version release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]')))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FROZEN_RELEASE_TAG }}
          name: FrozenApps ${{ env.FROZEN_RELEASE_TAG }}
          generate_release_notes: true
          files: |
            FrozenApps-unsigned.ipa
            FrozenApps-unsigned.ipa.sha256
          fail_on_unmatched_files: true

      - name: Upload build output for repository owner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrozenApps-build-output
          path: |
            build.log
            build-validation.txt
            FrozenApps-unsigned.ipa
            FrozenApps-unsigned.ipa.sha256
          if-no-files-found: warn
          retention-days: 14
