name: Publish verified FrozenApps v1.0.2 IPA

on:
  push:
    branches: ["release/v1.0.2-workflow-fix"]

permissions:
  actions: read
  contents: write

concurrency:
  group: frozenapps-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: xcode-27
    steps:
      - name: Download the successful v1.0.2 build artifact
        uses: actions/download-artifact@v4
        with:
          name: FrozenApps-build-output
          run-id: 39241907363
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-output

      - name: Verify IPA and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-output
          test -s FrozenApps-unsigned.ipa
          test -s FrozenApps-unsigned.ipa.sha256
          EXPECTED="$(awk 'NR == 1 { print $1 }' FrozenApps-unsigned.ipa.sha256)"
          ACTUAL="$(shasum -a 256 FrozenApps-unsigned.ipa | awk '{ print $1 }')"
          test -n "$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
          /usr/bin/unzip -t FrozenApps-unsigned.ipa
          /usr/bin/unzip -Z1 FrozenApps-unsigned.ipa | grep -q '^Payload/FrozenApps.app/Info.plist$'
          echo "Verified FrozenApps IPA SHA-256: $ACTUAL"

      - name: Attach verified IPA to the v1.0.2 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          files: |
            release-output/FrozenApps-unsigned.ipa
            release-output/FrozenApps-unsigned.ipa.sha256
          fail_on_unmatched_files: true
