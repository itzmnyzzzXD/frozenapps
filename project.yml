name: FrozenApps
options:
  bundleIdPrefix: com.itzmnyzzz
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "5"
    TARGETED_DEVICE_FAMILY: "1,2"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  FrozenApps:
    type: application
    platform: iOS
    sources:
      - path: Vendor/SideInstaller/ios-app
      - path: InstallerIntegration
    dependencies:
      - framework: Vendor/SideInstaller/SideInstallerFFI.xcframework
        embed: false
      - target: FrozenAppsLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itzmnyzzz.frozenapps
        PRODUCT_NAME: FrozenApps
        INFOPLIST_FILE: Vendor/SideInstaller/ios-app/Info.plist
        OTHER_LDFLAGS: "$(inherited) -lc++ -lz"
        GENERATE_INFOPLIST_FILE: NO

  FrozenAppsLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Vendor/SideInstaller/ios-live-activity
      - path: Vendor/SideInstaller/ios-app/PairingActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itzmnyzzz.frozenapps.LiveActivity
        INFOPLIST_FILE: Vendor/SideInstaller/ios-live-activity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
