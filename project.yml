name: FrozenApps
options:
  bundleIdPrefix: com.itzmnyzzz
  deploymentTarget:
    iOS: "16.0"
targets:
  FrozenApps:
    type: application
    platform: iOS
    sources:
      - FrozenApps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itzmnyzzz.frozenapps
        PRODUCT_NAME: FrozenApps
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: FrozenApps
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES